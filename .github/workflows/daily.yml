name: Daily MyNewsdesk Scrape

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-driver

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          MYNEWS_EMAIL: ${{ secrets.MYNEWS_EMAIL }}
          MYNEWS_PASSWORD: ${{ secrets.MYNEWS_PASSWORD }}

          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}

          SP_SITE_HOSTNAME: ${{ secrets.SP_SITE_HOSTNAME }}
          SP_SITE_PATH: ${{ secrets.SP_SITE_PATH }}
          SP_DOC_LIBRARY: ${{ secrets.SP_DOC_LIBRARY }}
          SP_FOLDER_PATH: ${{ secrets.SP_FOLDER_PATH }}

        run: |
          python run.py
